
name: Publier Baya

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer le site Baya
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./BAYA-NEW-APP-main

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
